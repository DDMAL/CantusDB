name: js-tests
on:
    pull_request:
        types: [opened, synchronize, reopened, ready_for_review]
jobs:
    js-tests:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: "22"
            # Node's built-in test runner — no npm install, no dependencies.
            - run: node --test js_tests/*.test.js
