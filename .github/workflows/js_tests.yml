name: js-tests
on:
    pull_request:
        types: [opened, synchronize, reopened, ready_for_review]
jobs:
    javascript-tests:
        permissions:
            contents: read
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  persist-credentials: false
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
            # Node's built-in test runner; the project has no JS dependencies
            # and no package manifest, so there is nothing to install.
            - run: node --test "tests/js/**/*.test.js" js_tests/*.test.js
