{% extends "single_column_with_search_bar.html" %}

{% block title %}
    <title>{{ century.name }} | Cantus Database</title>
{% endblock %}

{% block header %}
    <h3>{{ century.name }}</h3>
{% endblock %}
{% block maincontent %}
<div class="row">
    <div class="col">
        <ul>
            {% for source in sources %}
                <li>
                    <a href="{% url 'source-detail' source.id %}" title="{{ source.short_heading }}">
                        {{ source.heading }}
                    </a>
                </li>
            {% endfor %}
        </ul>
    </div>
</div>
{% endblock %}
